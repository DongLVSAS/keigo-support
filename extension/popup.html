<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>敬語サポート</title>
<style>
body{
    font-family:system-ui,Arial;
    margin:12px;
    width:260px
}
button{
    padding:6px 10px
}
.toggle-container{
    display:flex;
    justify-content:space-between;
    margin:15px 0
}
.toggle-switch{
    position:relative;
    width:50px;
    height:24px;
    background:#ccc;
    border-radius:12px;
    cursor:pointer;
    transition:background 0.3s
}
.toggle-switch.active{
    background:#ff6b35
}
.toggle-slider{
    position:absolute;
    top:2px;
    left:2px;
    width:20px;
    height:20px;
    background:white;
    border-radius:50%;
    transition:transform 0.3s
}
.toggle-switch.active .toggle-slider{
    transform:translateX(26px)
}
.status-text{
    font-size:14px;
    color:#666;
    font-weight:500
}
.extension-status{
    font-size:12px;
    color:#999;
    margin-top:5px
}
.check-level{
    font-size:12px;
    color:#666;
    font-weight:500
}
#level {
    margin-left: 8px;
    border: 2px solid #ff6b35;
    border-radius: 6px;
    padding: 2px;
    font-size: 12px;
    font-weight: 500;
}
</style>
</head>
<body>
<h3>敬語サポート</h3>
<div class="toggle-container">
  <div>
    <span class="status-text">利用ステータス：</span>
    <div class="extension-status" id="statusText">Loading...</div>
  </div>
  <div class="toggle-switch" id="extensionToggle">
    <div class="toggle-slider"></div>
  </div>
</div>
<div style="margin-top:10px;">
<label>形式性：
  <select id="level">
    <option value="polite">丁寧語</option>
    <option value="honorific">尊敬語・謙譲語</option>
  </select>
</label>
</div>
<script src="popup.js"></script>
</body>
</html>
